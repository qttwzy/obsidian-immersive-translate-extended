name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Check syntax and generated output
        run: npm run quality

      - name: Verify production dependency metadata
        run: npm sbom --omit=dev --package-lock-only --sbom-format spdx --sbom-type application > /tmp/imt-sbom.spdx.json

      - name: Confirm generated files are committed
        run: git diff --exit-code -- plugin/main.js
