name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json to publish as a prerelease
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'qttwzy/obsidian-immersive-translate-extended' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Confirm version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"

      - name: Run product checks
        run: npm run quality

      - name: Build release ZIP
        run: npm run package:build -- --root "$PWD" --out "$RUNNER_TEMP/plugin-package"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Download the complete plugin ZIP below and follow the installation steps in README.md.

          Project-owned code is licensed under GNU GPL version 3 only (GPL-3.0-only).
          [Corresponding source and build scripts](https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/v$RELEASE_VERSION.zip) · [Browse the source](https://github.com/$GITHUB_REPOSITORY/tree/v$RELEASE_VERSION).
          Third-party components retain their own terms; see THIRD_PARTY_NOTICES.md in the ZIP.
          EOF
          gh release create "v$RELEASE_VERSION" "$RUNNER_TEMP/plugin-package/immersive-translate-extended-$RELEASE_VERSION.zip" --target "$GITHUB_SHA" --prerelease --title "Immersive Translate Extended $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
