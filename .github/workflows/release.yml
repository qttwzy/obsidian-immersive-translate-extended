name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the package.json version to build a GitHub Pre-release from this commit
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Confirm the dispatched version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "${{ github.event.inputs.confirm }}"

      - name: Write platform evidence
        env:
          PLATFORM_EVIDENCE_JSON: ${{ secrets.PLATFORM_EVIDENCE_JSON }}
        run: |
          set -euo pipefail
          test -n "${PLATFORM_EVIDENCE_JSON}"
          printf '%s\n' "$PLATFORM_EVIDENCE_JSON" > "$RUNNER_TEMP/platform-evidence.json"

      - name: Build release assets
        run: |
          npm run release:build -- \
            --root "$PWD" \
            --platform-evidence "$RUNNER_TEMP/platform-evidence.json" \
            --out "$RUNNER_TEMP/imt-release"

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES="$(printf 'Immersive Translate Extended %s\n\nCommit %s\n' "$VERSION" "$GITHUB_SHA")"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Immersive Translate Extended ${VERSION}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            "$RUNNER_TEMP"/imt-release/*
